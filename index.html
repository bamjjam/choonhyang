  if(S.screen==='title'){ $('#top').innerHTML=''; return; }
  const coins = Array.from({length:5},(_,i)=>`<span class="coin ${i<S.coins?'':'off'}"></span>`).join('');
  $('#top').innerHTML = `<span class="logo"><em>떡잎</em>부터 무죄</span>
    ${st.type==='cross'?`<span class="coins" aria-label="기력 엽전 ${S.coins}개">${coins}</span>`:''}
    <button class="seal sm blue" data-act="evbox">증거함 ${S.ev.length}</button>
    <button class="seal sm blue" data-act="pouch">낱말 주머니</button>
    ${st.type==='cross'?`<button class="seal sm" data-act="hint">힌트</button>`:''}
    <button class="seal sm" data-act="home">처음 화면</button>`;
}
let modalNext = null;
function modal(html){ $('#sheet').innerHTML = html; $('#modal').hidden=false; const b=$('#sheet').querySelector('button'); if(b) b.focus(); }
function closeModal(){ $('#modal').hidden=true; const cb = modalNext; modalNext=null; if(cb) cb(); }
function whoBox(id, mood, html){ return `<div class="who"><div class="mini">${face(id,mood)}</div><div>${CHARS[id]?`<span class="wn">${CHARS[id].name}</span>`:''}${html}</div></div>`; }

function fx(kind){
  const box = $('#fx');
  if(kind==='drum'){ const sc=$('.scene'); if(sc){ sc.classList.remove('shake'); void sc.offsetWidth; sc.classList.add('shake'); } return; }
  if(kind==='shout') box.innerHTML = `<div class="shout">잠깐, 그 말씀 이상하오!</div>`;

  clearTimeout(fx.t); fx.t = setTimeout(()=>box.innerHTML='', 1400);
}

// ============ 대사 엔진 ============
function play(lines, start, done, persist){
  T = {lines, i:start||0, done, persist, por:null, mood:'normal'};
  for(let j=0;j<=T.i && j<lines.length;j++){ const w=lines[j].who; if(ART[w]){ T.por=w; T.mood=lines[j].mood||'normal'; } }
  drawLine(true);
}
function drawLine(firstDraw){
  const ln = T.lines[T.i]; const c = CHARS[ln.who]||{name:''};
  if(ART[ln.who]){ T.por = ln.who; T.mood = ln.mood||'normal'; }
  const isNarr = ln.who==='narr';
  $('#view').innerHTML = `
    <div class="scene">${backdrop()}<div class="por">${T.por?face(T.por,T.mood):''}</div></div>
    <div class="dlg" data-act="next" role="button" tabindex="0" aria-label="다음 대사">
      ${c.name?`<span class="nm ${ln.who==='baleum'||ln.who==='hyangdan'?'blue':''}">${c.name}</span>`:''}
      <div class="tx ${isNarr?'narr':''}">${esc(ln.text)}</div>
      <span class="more">눌러서 계속 ▶</span>
    </div>`;
  if(ln.fx) setTimeout(()=>fx(ln.fx), firstDraw?60:0);
}
function nextLine(){
  if(!T) return;
  const ln = T.lines[T.i];
  const pend = (ln.gloss||[]).filter(w=>!S.seen[w]);
  if(pend.length){
    pend.forEach(w=>S.seen[w]=1); save();
    modalNext = advance;
    modal(`<h3>향단의 낱말 풀이</h3>${whoBox('hyangdan','happy', pend.map(w=>`<p class="gl"><b>${w}</b><br>${GLOSSARY[w]}</p>`).join(''))}<p class="muted">한 번 나온 낱말은 위쪽 "낱말 주머니"에서 다시 볼 수 있어요.</p><div class="row end"><button class="seal fill" data-act="close">알겠어요</button></div>`);
    return;
  }
  advance();
}
function advance(){
  T.i++;
  if(T.persist){ S.ti = T.i; save(); }
  if(T.i >= T.lines.length){ const d=T.done; T=null; d(); return; }
  drawLine(false);
}

// ============ 단계 ============
function go(n){ S.step=n; S.ti=0; T=null; save(); render(); }
function render(){
  topbar();
  $('#view').scrollTop = 0;
  if(S.screen==='title') return drawTitle();
  const st = STEPS[S.step];
  if(st.type==='talk') return play(st.lines, S.ti, ()=>go(S.step+1), true);
  if(st.type==='investigate') return drawInvestigate();
  if(st.type==='cross') return drawCross();
  if(st.type==='seat') return drawSeat();
  if(st.type==='scale') return drawScale();
  if(st.type==='verdict') return drawVerdict();
  if(st.type==='diary') return drawDiary();
  if(st.type==='end') return drawEnd();
}

function drawInvestigate(){
  const all = PLACES.every(p=>S.ev.includes(p.ev));
  $('#view').innerHTML = `<div class="board">
    <h2>현장 조사</h2>
    <p class="muted">다섯 곳을 모두 둘러보고 증거를 모으세요. (${S.ev.length}/5)</p>
    <div class="places">${PLACES.map(p=>{ const got=S.ev.includes(p.ev);
      return `<button class="place ${got?'done':''}" data-act="place" data-v="${p.id}">${placeIcon(p.id)}<b>${p.name}</b><small>${got?'찾음: '+EVIDENCE[p.ev].name:'아직 안 둘러봤어요'}</small></button>`; }).join('')}</div>
    <div class="row end" style="margin-top:16px"><button class="seal fill" data-act="toCourt" ${all?'':'disabled'}>법정으로 돌아가기</button></div>

function visitPlace(id){
 const p=PLACES.find(x=>x.id===id),e=EVIDENCE[p.ev],doc=['ledger','note','order'].includes(p.ev);
 if(!S.ev.includes(p.ev)){S.ev.push(p.ev);save();}
 modalNext=()=>{topbar();drawInvestigate();};
 const card=doc?`<button type="button" class="ev evidence-toggle" data-act="docopen" aria-expanded="false" aria-controls="found-document"><span class="ic">${evIcon(p.ev)}</span><span class="ev-title"><b>${e.name}</b><small class="doc-action">문서 펼치기 ＋</small></span></button>`:`<div class="ev evidence-static"><span class="ic">${evIcon(p.ev)}</span><div><b>${e.name}</b></div></div>`;
 modal(`<div class="location-banner">${placeIcon(p.id)}</div><h3>${p.name}에서 찾은 증거</h3>${card}${whoBox(p.who,'happy',`<p>${esc(p.line)}</p>`)}${doc?`<div id="found-document" hidden>${evView(p.ev)}</div>`:evView(p.ev)}<div class="row end"><button class="seal fill" data-act="close">증거함에 넣기</button></div>`);

// ---- 심문 ----
function cw(){ const id=STEPS[S.step].w; return S.w[id] || (S.w[id]={si:0, hint:0, wrong:0, mood:'normal', reply:null, asking:false, pair:false, sel:[]}); }
function drawCross(){
  const id = STEPS[S.step].w, W = WIT[id], c = cw();
  const s = W.statements[c.si];
  $('#view').innerHTML = `
    <div class="scene">${backdrop()}<span class="tagline">${CHARS[id].name}의 증언</span><div class="por">${face(id,c.mood)}</div></div>
    ${c.reply ? `<div class="stmt reply"><span class="nm">${CHARS[id].name}</span><div class="tx">${esc(c.reply)}</div></div>`
      : `<div class="stmt"><span class="nm">증언 ${c.si+1} / ${W.statements.length}</span><div class="tx">"${esc(s.t)}"</div></div>`}
    <div class="row">
      <div class="chips" role="group" aria-label="증언 고르기">${W.statements.map((_,i)=>`<button class="chip ${c.pair? (c.sel.includes(i)?'pick':'') : (i===c.si?'on':'')}" data-act="chip" data-v="${i}" aria-label="증언 ${i+1}">${i+1}</button>`).join('')}</div>
    </div>
    ${c.pair ? `<p class="muted">서로 어긋나는 증언 두 개를 고르세요. (${c.sel.length}/2)</p>
      <div class="row"><button class="seal fill" data-act="pairgo" ${c.sel.length===2?'':'disabled'}>이 두 증언 맞대기</button><button class="seal" data-act="paircancel">그만두기</button></div>`
    : `<div class="row">
        <button class="seal blue" data-act="ask">질문하기</button>
        <button class="seal fill" data-act="present">이 증언에 증거 내밀기</button>
        <button class="seal" data-act="pair">두 증언 맞대기</button>
      </div>`}
    ${c.asking ? `<div class="cards">${s.cards.map((q,i)=>`<button class="qcard" data-act="card" data-v="${i}">${esc(q.q)}</button>`).join('')}</div>`:''}
    <p class="muted">증언 번호를 눌러 넘겨 보세요. 이상한 말을 찾으면 증거를 내밀거나 두 증언을 맞대 보세요.</p>`;
}
function wrong(msg){
  const c = cw(); S.coins--; c.wrong++; c.mood='normal'; c.reply=null; c.pair=false; c.sel=[];
  let extra='';
  if(S.coins<=0){ S.coins=5; c.si=0; extra=`<p class="gl">엽전을 다 썼어요. 이 증인의 심문을 처음부터 다시 해요. 엽전은 다시 채워 드릴게요!</p>`; }
  save();
  const autoHint = c.wrong%2===0 && c.hint<3;
  modalNext = ()=>{ topbar(); drawCross(); if(autoHint){ c.hint++; save(); showHint(); } };
  modal(`${whoBox('mongryong','normal',`<p>${esc(msg)}</p>`)}<p class="muted">기력 엽전 하나가 줄었어요.</p>${extra}<div class="row end"><button class="seal fill" data-act="close">다시 생각해 보기</button></div>`);
}
function showHint(){
  const W = WIT[STEPS[S.step].w], c = cw();
  if(c.hint<1) c.hint=1;
  const list = W.hints.slice(0,c.hint).map((h,i)=>`<p class="gl"><b>힌트 ${i+1}</b><br>${esc(h)}</p>`).join('');
  modal(`<h3>향단의 힌트</h3>${whoBox('hyangdan','happy',list)}<div class="row end">${c.hint<3?`<button class="seal blue" data-act="morehint">더 자세한 힌트</button>`:''}<button class="seal fill" data-act="close">알겠어요</button></div>`);
}
function solved(){
  const id = STEPS[S.step].w; const W = WIT[id]; const c=cw(); c.done=true; c.reply=null; save();
  play(W.success, 0, ()=>go(S.step+1), false);
}
function tryPresent(ev){
  const W = WIT[STEPS[S.step].w], c = cw(), sol = W.solve;
  if(sol.mode==='present' && sol.ev===ev && sol.stmts.includes(c.si)){
    if(sol.point){
      modalNext=null;
      modal(`${whoBox('mongryong','normal','<p>변호인, 배치도의 어디가 이상하오? 가리켜 보시오.</p>')}<div class="mapwrap">${kitchenMap(true)}</div>
        <div class="hotspots">${[['fire','아궁이'],['cup','찬장'],['jang','장독대'],['well','우물가']].map(a=>`<button class="seal blue" data-act="spot" data-v="${a[0]}">${a[1]}</button>`).join('')}</div>`);
      return;
    }
    $('#modal').hidden=true; solved(); return;
  }
  $('#modal').hidden=true;
  wrong('그 증거가 지금 증언과 무슨 상관이오?');
}

function drawSeat(msg){
  $('#view').innerHTML = `<div class="board">
    <h2>좌석표와 차림표</h2>
    <p class="muted">손님들이 먹은 음식과 배탈 여부예요. 빨간 글씨가 아픈 손님이에요.</p>
    ${evView('seat')}
    <p style="margin:16px 0 10px;font-family:var(--f-display);font-size:21px">아픈 손님들이 <u>모두</u> 먹은 음식은 무엇일까요?</p>
    <div class="row">${SEAT.foods.map((f,i)=>`<button class="seal blue" data-act="seatpick" data-v="${i}">${f}</button>`).join('')}</div>
    ${msg?`<div style="margin-top:14px">${whoBox('hyangdan','sweat',`<p>${esc(msg)}</p>`)}</div>`:''}
  </div>`;
}
function seatPick(i){
  const sick = SEAT.rows.filter(r=>r[2]);
  const ok = sick.every(r=>r[1][i]);
  if(!ok){
    const miss = sick.find(r=>!r[1][i]);
    return drawSeat(`음... ${miss[0]}은(는) ${SEAT.foods[i]}을(를) 안 먹었는데도 아팠어요. 아픈 사람 모두에게 공통인 음식을 찾아봐요!`);
  }
  play([
    L('hyangdan','맞아요! 아픈 사람은 모두 생선찜을 먹었어요.',{mood:'happy'}),
    L('hyangdan','모두에게 공통인 걸 찾으면 원인이 보여요!'),
    L('baleum','떡만 먹은 포목 상인과 서당 훈장님은 멀쩡하고. 범인은 떡이 아니라 생선찜이야!'),
    L('mongryong','흠... 그렇다면 생선찜을 다룬 사람을 불러야겠소. 생선을 나른 자를 들이시오!')
  ], 0, ()=>go(S.step+1), false);
}

function verdictKey(){
  const w = PANS.map(p=>[p.id, S.scale[p.id].length]).sort((a,b)=>b[1]-a[1]);
  return w[0][1] > w[1][1] ? w[0][0] : 'even';
}

function drawVerdict(){
  const k = S.vkey || (S.vkey = verdictKey()); save();
  const lean = k==='even' ? '저울이 고르게 기울었어요.' : `저울이 ${PANS.find(p=>p.id===k).name} 쪽으로 기울었어요.`;
  $('#view').innerHTML = `<div class="board">
    <p class="muted" style="text-align:center;margin:0">${lean}</p>
    <div class="big">춘향은 <span style="color:var(--jeok)">무죄</span>!</div>
    <p style="text-align:center;margin:0 0 14px">떡은 배탈의 원인이 아니었어요.</p>

    <div class="p p3">${face('hyangdan','happy')}</div>
    <div class="p p2">${face('baleum','happy')}</div>
  </div>
  <div class="titlewrap">
    <span class="stamp">판결 완료</span>
    <h1 style="font-size:clamp(36px,8vw,58px)">제1화 끝</h1><a class="seal fill seal-link" href="episode2.html">제2화 · 흥부의 사건 맡기 →</a>
    <p style="margin:0">춘향의 억울함을 풀었어요! 증언의 모순을 찾는 네 가지 방법을 모두 써 봤어요.</p>
    <p class="muted" style="margin:0">자기모순 · 현장 배치 · 문서 날짜 · 증거품</p>
    <div class="row"><button class="seal blue" data-act="diaryview">내 판관 일기</button><button class="seal" data-act="newgame">처음부터 다시</button><button class="seal fill" data-act="home">처음 화면</button></div>
  </div>`;
}

function evBox(pick){
  const c = (STEPS[S.step]||{}).type==='cross' ? cw() : null;
  modal(`<h3>${pick?`증언 ${c.si+1}번에 내밀 증거 고르기`:'증거함'}</h3>
    ${S.ev.length?`<div class="evlist">${S.ev.map(e=>`<button class="ev" data-act="${pick?'evpick':'evshow'}" data-v="${e}"><span class="ic">${evIcon(e)}</span><div><b>${EVIDENCE[e].name}</b><br><span class="muted">${EVIDENCE[e].desc}</span></div></button>`).join('')}</div>`:'<p class="muted">아직 모은 증거가 없어요.</p>'}
    <div class="row end"><button class="seal" data-act="close">닫기</button></div>`);
}
function pouch(){
  const ws = Object.keys(GLOSSARY).filter(w=>S.seen[w]);
  modal(`<h3>낱말 주머니</h3>${ws.length? ws.map(w=>`<p class="gl"><b>${w}</b><br>${GLOSSARY[w]}</p>`).join('') : '<p class="muted">아직 모은 낱말이 없어요. 재판을 진행하면 하나씩 모여요.</p>'}<div class="row end"><button class="seal fill" data-act="close">닫기</button></div>`);
}
function diaryView(){
  const a = diaries();
  modal(`<h3>내 판관 일기</h3>${a.length? a.map(d=>`<div class="gl"><span class="muted">${esc(d.date)} · 제1화</span><br><b>${esc(d.choice)}</b>${d.text?`<br>${esc(d.text)}`:''}</div>`).join('') : '<p class="muted">아직 쓴 일기가 없어요. 제1화를 끝까지 하면 일기를 쓸 수 있어요.</p>'}<div class="row end"><button class="seal fill" data-act="close">닫기</button></div>`);
}
function guardian(){
  modal(`<h3>보호자 안내</h3>
    <p><b>어떤 게임인가요?</b><br>춘향전을 활용하여 각색한 법정 추리 게임이에요. 아이는 소송 대리인 "나바름"이 되어 증언 속 모순을 찾고, 억울한 누명을 쓴 춘향을 돕습니다.</p>
    <p><b>제1화 줄거리</b><br>사또 생일잔치에서 손님들이 배탈이 나고, 춘향이 보낸 떡이 의심받습니다. 진짜 원인은 따뜻한 곳에 오래 둔 묵은 생선찜이었고, 그 뒤에는 어부들을 지키려던 부엌 어멈의 사연과 사또의 무리한 명령이 있었습니다.</p>
    <p><b>아이와 나눌 질문</b></p>
    <ol style="margin:0;padding-left:20px"><li>어멈은 좋은 뜻으로 한 일인데, 그래도 책임을 져야 할까?</li><li>조선 판관과 현대 판사의 판결은 왜 달랐을까?</li><li>음식을 상하지 않게 보관하려면 어떻게 해야 할까?</li></ol>
    <p><b>교과 연결</b><br>국어(고전문학 춘향전) · 사회(옛날과 오늘날의 재판, 권력의 바른 사용) · 과학(세균과 음식이 상하는 원리, 공통 원인 찾기)</p>
    <p class="muted">이 게임은 로그인이나 개인정보를 받지 않으며, 진행 상황과 판관 일기는 이 기기 안에만 저장됩니다.</p>
    <div class="row end"><button class="seal fill" data-act="close">닫기</button></div>`);
}

// ============ 입력 ============
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  if(el.disabled) return;
  act(el.dataset.act, el.dataset.v);
});
document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role=button][data-act]')){ e.preventDefault(); act(e.target.dataset.act, e.target.dataset.v); }
  if(e.key==='Escape' && !$('#modal').hidden) closeModal();
});
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

function act(a, v){
  const c = (STEPS[S.step]||{}).type==='cross' && S.screen==='game' ? cw() : null;
  switch(a){
    case 'docopen': { const panel=$('#found-document'),btn=$('[data-act="docopen"]');if(panel&&btn){panel.hidden=!panel.hidden;btn.setAttribute('aria-expanded',String(!panel.hidden));btn.querySelector('.doc-action').textContent=panel.hidden?'문서 펼치기 ＋':'문서 접기 −';}break; }

    case 'newgame': { const seen=S.seen; S=fresh(); S.seen=seen; S.screen='game'; save(); render(); break; }
    case 'continue': S.screen='game'; render(); break;
    case 'home': S.screen='title'; T=null; save(); render(); break;
    case 'diaryview': diaryView(); break;
    case 'guardian': guardian(); break;
    case 'close': closeModal(); break;
    case 'next': nextLine(); break;
    case 'evbox': evBox(false); break;
    case 'evshow': modal(`<h3>${EVIDENCE[v].name}</h3>${evView(v)}<p>${EVIDENCE[v].desc}</p><div class="row end"><button class="seal" data-act="evbox">증거함으로</button><button class="seal fill" data-act="close">닫기</button></div>`); break;
    case 'pouch': pouch(); break;
    case 'place': visitPlace(v); break;
    case 'toCourt': go(S.step+1); break;
    case 'hint': if(c){ if(c.hint<1) c.hint=1; save(); showHint(); } break;
    case 'morehint': if(c && c.hint<3){ c.hint++; save(); } showHint(); break;
    case 'chip': {
      const i=+v;
      if(c.pair){ if(c.sel.includes(i)) c.sel=c.sel.filter(x=>x!==i); else if(c.sel.length<2) c.sel.push(i); }
      else { c.si=i; c.reply=null; c.asking=false; c.mood='normal'; }
      drawCross(); break;
    }
    case 'ask': c.asking=!c.asking; c.reply=null; drawCross(); break;
    case 'card': { const q = WIT[STEPS[S.step].w].statements[c.si].cards[+v]; c.reply=q.a; c.mood=q.s?'sweat':'normal'; c.asking=false; drawCross(); break; }
    case 'present': c.asking=false; evBox(true); break;
    case 'evpick': tryPresent(v); break;
    case 'spot': $('#modal').hidden=true; if(v===WIT[STEPS[S.step].w].solve.point) solved(); else wrong('그곳에는 이상한 점이 없소. 방자의 말과 어긋나는 곳을 찾으시오.'); break;
    case 'pair': c.pair=true; c.sel=[]; c.asking=false; c.reply=null; drawCross(); break;
    case 'paircancel': c.pair=false; c.sel=[]; drawCross(); break;
    case 'pairgo': {
      const sol = WIT[STEPS[S.step].w].solve; const sel=[...c.sel].sort();
      c.pair=false;
      if(sol.mode==='pair' && sel[0]===sol.pair[0] && sel[1]===sol.pair[1]) solved();
      else { c.sel=[]; wrong('두 증언이 서로 어긋나지 않소. 다시 살펴보시오.'); }
      break;
    }
    case 'seatpick': seatPick(+v); break;
    case 'tok': selTok = selTok===v ? null : v; drawScale(); break;
    case 'pan': if(selTok){ S.scale[v].push(selTok); selTok=null; save(); drawScale(); } break;
    case 'unplace': { const [p,e]=v.split('|'); S.scale[p]=S.scale[p].filter(x=>x!==e); save(); drawScale(); break; }
    case 'toVerdict': S.vkey=null; go(S.step+1); break;
    case 'rescale': S.vkey=null; go(S.step-1); break;
    case 'toDiary': go(S.step+1); break;
    case 'dpick': { const t=$('#dline')?$('#dline').value:''; S.dpick=+v; save(); drawDiary(); $('#dline').value=t; break; }
    case 'dsave': {
      const text = ($('#dline').value||'').trim().slice(0,80);
      const d = new Date(); const ok = addDiary({date:`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`, choice:DIARY_OPTS[S.dpick], text});
      if(!ok) return drawDiary('이 기기에서는 일기를 저장할 수 없어요. 그래도 게임은 계속할 수 있어요.');
      go(S.step+1); break;
    }
  }
}

// ============ 시작 ============
function start(data){
  if(data && data.S){ S=data.S; hasSave = true; }
  else { const sv = load(); if(sv){ S = Object.assign(fresh(), sv); S.screen='title'; } }
  render();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
